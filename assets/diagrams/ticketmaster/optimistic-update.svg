<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" role="img" aria-labelledby="title desc"><title id="title">같은 버전을 읽어도 성공은 한 번만</title><desc id="desc">핵심은 SELECT가 아니라 UPDATE의 WHERE 조건</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#526078" stroke-width="1.7"/></marker></defs><rect width="960" height="555" rx="20" fill="#faf8f2"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#27364b"><text x="34" y="43" font-size="28" font-weight="600" fill="#27364b">같은 버전을 읽어도 성공은 한 번만</text><text x="34" y="77" font-size="19" font-weight="400" fill="#27364b">핵심은 SELECT가 아니라 UPDATE의 WHERE 조건</text><path d="M41 114 Q164.5 110 289 113 Q298 114 296 124 L295 210 Q296 220 286 218 L42 219 Q31 218 34 207 L33 122 Q33 112 41 114 Z" fill="#dceafb" stroke="#526078" stroke-width="2"/><text x="49" y="144" font-size="23" font-weight="600" fill="#27364b">사용자 B</text><text x="49" y="176" font-size="19" font-weight="400" fill="#27364b">AVAILABLE / version 7</text><path d="M670 114 Q794.0 110 919 113 Q928 114 926 124 L925 210 Q926 220 916 218 L671 219 Q660 218 663 207 L662 122 Q662 112 670 114 Z" fill="#dceafb" stroke="#526078" stroke-width="2"/><text x="678" y="144" font-size="23" font-weight="600" fill="#27364b">사용자 C</text><text x="678" y="176" font-size="19" font-weight="400" fill="#27364b">AVAILABLE / version 7</text><path d="M347 273 Q479.0 269 612 272 Q621 273 619 283 L618 397 Q619 407 609 405 L348 406 Q337 405 340 394 L339 281 Q339 271 347 273 Z" fill="#dceee5" stroke="#526078" stroke-width="2"/><text x="355" y="303" font-size="23" font-weight="600" fill="#27364b">DB의 좌석 한 행</text><text x="355" y="335" font-size="19" font-weight="400" fill="#27364b">WHERE AVAILABLE</text><text x="355" y="364" font-size="19" font-weight="400" fill="#27364b">AND version = 7</text><text x="355" y="393" font-size="19" font-weight="400" fill="#27364b">SET HELD, version = 8</text><path d="M168 218 L338 297" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="63" y="258" font-size="20" font-weight="400" fill="#27364b">B가 먼저 갱신</text><path d="M792 218 L621 340" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="727" y="305" font-size="20" font-weight="400" fill="#27364b">C도 같은 조건</text><path d="M41 348 Q164.5 344 289 347 Q298 348 296 358 L295 425 Q296 435 286 433 L42 434 Q31 433 34 422 L33 356 Q33 346 41 348 Z" fill="#dceee5" stroke="#526078" stroke-width="2"/><text x="49" y="378" font-size="23" font-weight="600" fill="#27364b">B → 1행 변경</text><text x="49" y="410" font-size="19" font-weight="400" fill="#27364b">확보 성공</text><path d="M670 348 Q794.0 344 919 347 Q928 348 926 358 L925 425 Q926 435 916 433 L671 434 Q660 433 663 422 L662 356 Q662 346 670 348 Z" fill="#f5ddda" stroke="#526078" stroke-width="2"/><text x="678" y="378" font-size="23" font-weight="600" fill="#27364b">C → 0행 변경</text><text x="678" y="410" font-size="19" font-weight="400" fill="#27364b">상태·버전 불일치</text><text x="34" y="491" font-size="21" font-weight="600" fill="#416864">0행 = 이번 갱신의 조건 불일치. “내 요청이 이미 성공”이라는 뜻이 아니다.</text></g></svg>