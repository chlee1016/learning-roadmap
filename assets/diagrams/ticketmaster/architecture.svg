<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">어디에서 부하를 줄이고, 어디에서 정확성을 지킬까?</title><desc id="desc">입장 허가는 대기열에서 / 좌석 확보의 최종 판단은 DB에서</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#526078" stroke-width="1.7"/></marker></defs><rect width="960" height="580" rx="20" fill="#faf8f2"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#27364b"><text x="34" y="43" font-size="28" font-weight="600" fill="#27364b">어디에서 부하를 줄이고, 어디에서 정확성을 지킬까?</text><text x="34" y="77" font-size="19" font-weight="400" fill="#27364b">입장 허가는 대기열에서 / 좌석 확보의 최종 판단은 DB에서</text><path d="M40 121 Q137.0 117 235 120 Q244 121 242 131 L241 229 Q242 239 232 237 L41 238 Q30 237 33 226 L32 129 Q32 119 40 121 Z" fill="#dceafb" stroke="#526078" stroke-width="2"/><text x="48" y="151" font-size="23" font-weight="600" fill="#27364b">사용자</text><text x="48" y="183" font-size="19" font-weight="400" fill="#27364b">공연 A 입장 요청</text><text x="48" y="212" font-size="19" font-weight="400" fill="#27364b">좌석 선택</text><path d="M335 121 Q451.0 117 568 120 Q577 121 575 131 L574 229 Q575 239 565 237 L336 238 Q325 237 328 226 L327 129 Q327 119 335 121 Z" fill="#dceafb" stroke="#526078" stroke-width="2"/><text x="343" y="151" font-size="23" font-weight="600" fill="#27364b">대기열 서비스</text><text x="343" y="183" font-size="19" font-weight="400" fill="#27364b">입장 인원·속도 제한</text><text x="343" y="212" font-size="19" font-weight="400" fill="#27364b">서명된 입장 토큰 발급</text><path d="M242 176 L322 176" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M662 121 Q791.0 117 921 120 Q930 121 928 131 L927 229 Q928 239 918 237 L663 238 Q652 237 655 226 L654 129 Q654 119 662 121 Z" fill="#dceafb" stroke="#526078" stroke-width="2"/><text x="670" y="151" font-size="23" font-weight="600" fill="#27364b">예매 API</text><text x="670" y="183" font-size="19" font-weight="400" fill="#27364b">사용자·공연·만료 검증</text><text x="670" y="212" font-size="19" font-weight="400" fill="#27364b">DB의 조건부 갱신</text><path d="M576 176 L649 176" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M662 318 Q791.0 314 921 317 Q930 318 928 328 L927 426 Q928 436 918 434 L663 435 Q652 434 655 423 L654 326 Q654 316 662 318 Z" fill="#dceee5" stroke="#526078" stroke-width="2"/><text x="670" y="348" font-size="23" font-weight="600" fill="#27364b">DB · 최종 기준</text><text x="670" y="380" font-size="19" font-weight="400" fill="#27364b">AVAILABLE → HELD</text><text x="670" y="409" font-size="19" font-weight="400" fill="#27364b">성공한 커밋이 확보 결과</text><path d="M792 237 L792 310" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="647" y="261.5" font-size="18" font-weight="400" fill="#27364b">확보 요청</text><path d="M335 318 Q451.0 314 568 317 Q577 318 575 328 L574 426 Q575 436 565 434 L336 435 Q325 434 328 423 L327 326 Q327 316 335 318 Z" fill="#f6e6c7" stroke="#526078" stroke-width="2"/><text x="343" y="348" font-size="23" font-weight="600" fill="#27364b">Redis · 보조 캐시</text><text x="343" y="380" font-size="19" font-weight="400" fill="#27364b">DB 성공 결과를 반영</text><text x="343" y="409" font-size="19" font-weight="400" fill="#27364b">실패하면 재시도·복구</text><path d="M653 376 L580 376" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="39" y="342" font-size="22" font-weight="600" fill="#27364b">입장 토큰 ≠ 예약 토큰</text><text x="39" y="376" font-size="21" font-weight="400" fill="#27364b">대기열은 부하 제어</text><text x="39" y="411" font-size="21" font-weight="400" fill="#27364b">DB는 중복 판매 방지</text><text x="34" y="497" font-size="21" font-weight="600" fill="#416864">Redis가 비어 있어도 “좌석이 비었다”는 뜻은 아니다.</text><text x="34" y="535" font-size="19" font-weight="400" fill="#27364b">다른 요청도 DB에서 검증하므로 캐시 반영 실패가 중복 확보로 이어지지 않는다.</text></g></svg>