<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">늦은 취소가 다른 사람의 확보를 지우면 안 된다</title><desc id="desc">현재 값과 요청의 예약 토큰을 비교하고, 삭제까지 원자적으로 처리한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#526078" stroke-width="1.7"/></marker></defs><rect width="960" height="530" rx="20" fill="#faf8f2"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#27364b"><text x="34" y="43" font-size="28" font-weight="600" fill="#27364b">늦은 취소가 다른 사람의 확보를 지우면 안 된다</text><text x="34" y="77" font-size="19" font-weight="400" fill="#27364b">현재 값과 요청의 예약 토큰을 비교하고, 삭제까지 원자적으로 처리한다.</text><path d="M42 134 Q163.5 130 286 133 Q295 134 293 144 L292 261 Q293 271 283 269 L43 270 Q32 269 35 258 L34 142 Q34 132 42 134 Z" fill="#dceafb" stroke="#526078" stroke-width="2"/><text x="50" y="164" font-size="23" font-weight="600" fill="#27364b">① A가 확보</text><text x="50" y="196" font-size="19" font-weight="400" fill="#27364b">현재 토큰 = hold-A</text><text x="50" y="225" font-size="19" font-weight="400" fill="#27364b">5분 뒤 만료</text><path d="M358 134 Q480.0 130 603 133 Q612 134 610 144 L609 261 Q610 271 600 269 L359 270 Q348 269 351 258 L350 142 Q350 132 358 134 Z" fill="#dceee5" stroke="#526078" stroke-width="2"/><text x="366" y="164" font-size="23" font-weight="600" fill="#27364b">② B가 새로 확보</text><text x="366" y="196" font-size="19" font-weight="400" fill="#27364b">현재 토큰 = hold-B</text><text x="366" y="225" font-size="19" font-weight="400" fill="#27364b">새 만료 시간</text><path d="M675 134 Q796.5 130 919 133 Q928 134 926 144 L925 261 Q926 271 916 269 L676 270 Q665 269 668 258 L667 142 Q667 132 675 134 Z" fill="#f5ddda" stroke="#526078" stroke-width="2"/><text x="683" y="164" font-size="23" font-weight="600" fill="#27364b">③ A의 취소 도착</text><text x="683" y="196" font-size="19" font-weight="400" fill="#27364b">요청 토큰 = hold-A</text><text x="683" y="225" font-size="19" font-weight="400" fill="#27364b">늦게 도착한 요청</text><path d="M294 195 L344 195" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M612 195 L661 195" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M222 337 Q479.0 333 737 336 Q746 337 744 347 L743 440 Q744 450 734 448 L223 449 Q212 448 215 437 L214 345 Q214 335 222 337 Z" fill="#dceee5" stroke="#526078" stroke-width="2"/><text x="230" y="367" font-size="23" font-weight="600" fill="#27364b">현재 hold-B ≠ 요청 hold-A</text><text x="230" y="399" font-size="19" font-weight="400" fill="#27364b">토큰 불일치 → 삭제하지 않음 → B의 확보 유지</text><path d="M796 269 L745 364" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="34" y="493" font-size="21" font-weight="600" fill="#416864">사용자 고정 ID가 아니라, 확보 시도마다 새 예약 토큰을 발급한다.</text></g></svg>