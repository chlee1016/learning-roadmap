<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">임시 확보와 예매 확정은 서로 다른 상태</title><desc id="desc">시간 조건뿐 아니라 현재 예약 ID와 토큰도 함께 확인한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#526078" stroke-width="1.7"/></marker></defs><rect width="960" height="550" rx="20" fill="#faf8f2"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#27364b"><text x="34" y="43" font-size="28" font-weight="600" fill="#27364b">임시 확보와 예매 확정은 서로 다른 상태</text><text x="34" y="77" font-size="19" font-weight="400" fill="#27364b">시간 조건뿐 아니라 현재 예약 ID와 토큰도 함께 확인한다.</text><path d="M40 152 Q149.5 148 260 151 Q269 152 267 162 L266 264 Q267 274 257 272 L41 273 Q30 272 33 261 L32 160 Q32 150 40 152 Z" fill="#dceafb" stroke="#526078" stroke-width="2"/><text x="48" y="182" font-size="23" font-weight="600" fill="#27364b">AVAILABLE</text><text x="48" y="214" font-size="19" font-weight="400" fill="#27364b">누구도 확보하지 않음</text><path d="M363 152 Q476.0 148 590 151 Q599 152 597 162 L596 264 Q597 274 587 272 L364 273 Q353 272 356 261 L355 160 Q355 150 363 152 Z" fill="#f6e6c7" stroke="#526078" stroke-width="2"/><text x="371" y="182" font-size="23" font-weight="600" fill="#27364b">HELD</text><text x="371" y="214" font-size="19" font-weight="400" fill="#27364b">현재 예약·토큰 존재</text><text x="371" y="243" font-size="19" font-weight="400" fill="#27364b">5분 임시 확보</text><path d="M695 152 Q806.5 148 919 151 Q928 152 926 162 L925 264 Q926 274 916 272 L696 273 Q685 272 688 261 L687 160 Q687 150 695 152 Z" fill="#dceee5" stroke="#526078" stroke-width="2"/><text x="703" y="182" font-size="23" font-weight="600" fill="#27364b">CONFIRMED</text><text x="703" y="214" font-size="19" font-weight="400" fill="#27364b">결제 성공 확인</text><text x="703" y="243" font-size="19" font-weight="400" fill="#27364b">유효한 확보를 확정</text><path d="M269 212 L348 212" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="276" y="192" font-size="18" font-weight="400" fill="#27364b">확보</text><path d="M599 212 L680 212" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="606" y="192" font-size="18" font-weight="400" fill="#27364b">확정</text><path d="M476 274 V324 H149 V278" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="195" y="356" font-size="21" font-weight="400" fill="#27364b">만료·취소 → 좌석은 다시 AVAILABLE</text><path d="M208 407 Q480.0 403 753 406 Q762 407 760 417 L759 488 Q760 498 750 496 L209 497 Q198 496 201 485 L200 415 Q200 405 208 407 Z" fill="#f5ddda" stroke="#526078" stroke-width="2"/><text x="216" y="437" font-size="23" font-weight="600" fill="#27364b">만료 뒤 결제 성공 알림이 온다면</text><text x="216" y="469" font-size="19" font-weight="400" fill="#27364b">예매 확정 거절 + 결제 취소·환불 요청</text></g></svg>