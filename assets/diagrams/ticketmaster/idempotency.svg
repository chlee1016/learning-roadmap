<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 585" role="img" aria-labelledby="title desc"><title id="title">응답을 잃어도 같은 예약 결과를 돌려준다</title><desc id="desc">요청 ID는 첫 요청 전부터 클라이언트가 알고 있어야 한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M1 1 L8 4 L1 7" fill="none" stroke="#526078" stroke-width="1.7"/></marker></defs><rect width="960" height="585" rx="20" fill="#faf8f2"/><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#27364b"><text x="34" y="43" font-size="28" font-weight="600" fill="#27364b">응답을 잃어도 같은 예약 결과를 돌려준다</text><text x="34" y="77" font-size="19" font-weight="400" fill="#27364b">요청 ID는 첫 요청 전부터 클라이언트가 알고 있어야 한다.</text><text x="81" y="121" font-size="24" font-weight="600" fill="#27364b">클라이언트</text><text x="411" y="121" font-size="24" font-weight="600" fill="#27364b">예매 API</text><text x="774" y="121" font-size="24" font-weight="600" fill="#27364b">DB</text><path d="M140 140 V475" stroke="#a2a8b1" stroke-width="2" stroke-dasharray="6 7"/><path d="M480 140 V475" stroke="#a2a8b1" stroke-width="2" stroke-dasharray="6 7"/><path d="M815 140 V475" stroke="#a2a8b1" stroke-width="2" stroke-dasharray="6 7"/><path d="M146 174 L474 174" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="159" y="161" font-size="20" font-weight="400" fill="#27364b">요청 ID = req-42</text><path d="M486 230 L809 230" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="500" y="215" font-size="19" font-weight="400" fill="#27364b">좌석 확보 + 요청 결과 저장</text><text x="520" y="262" font-size="19" font-weight="600" fill="#416864">같은 트랜잭션으로 커밋</text><path d="M474 307 L146 307" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="196" y="295" font-size="20" font-weight="600" fill="#a94f4b">성공 응답 유실 ✕</text><path d="M146 368 L474 368" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="169" y="354" font-size="20" font-weight="400" fill="#27364b">같은 req-42로 재요청</text><path d="M486 405 L809 405" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="517" y="390" font-size="20" font-weight="400" fill="#27364b">기존 결과 조회</text><path d="M474 470 L146 470" fill="none" stroke="#526078" stroke-width="2.3" marker-end="url(#arrow)"/><text x="166" y="458" font-size="19" font-weight="400" fill="#27364b">기존 예약·토큰·만료 시간 반환</text><text x="34" y="529" font-size="21" font-weight="600" fill="#416864">응답에서 처음 알려주는 예약 토큰만으로는 응답 유실을 처리할 수 없다.</text></g></svg>